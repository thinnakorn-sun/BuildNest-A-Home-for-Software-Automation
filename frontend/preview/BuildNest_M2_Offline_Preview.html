function filteredProducts(){return state.products.filter(p=>(state.category==='All'||p.category===state.category)&&[p.name,p.desc,p.th,p.category,p.sub].join(' ').toLowerCase().includes(state.query.toLowerCase()))}

ed by Apify.'}</p></div></div><div class="path-step"><span class="path-num">B</span><div><b>${T('planBLabel')}</b><p>${state.lang==='th'?'ลูกค้าค้นหาและจ่ายผ่านเว็บไซต์ของเรา ก่อนรับไฟล์หรือเรียกใช้งาน':'Customers discover, purchase and access tools through our owned storefront.'}</p></div></div><div class="path-step"><span class="path-num">C</span><div><b>${T('hybridLabel')}</b><p>${state.lang==='th'?'Apify เป็นทั้งช่องทางขายและตัวประมวลผล ส่วนเว็บเป็นที่รวมบริการ':'Keep Apify as distribution and/or compute, while operating the owned customer hub.'}</p></div></div></div><div class="panel"><h3>${T('howItWorks')}</h3><p class="sub">Demo architecture and milestone status.</p>${[['01','Explore & Demo','Complete · browser preview'],['02','Auth & Checkout','Planned · Supabase / Stripe'],['03','Secure Delivery','Planned · Cloudflare R2'],['04','Automations','Planned · Apify API / worker']].map(([a,b,c])=>`<div class="mini-kpi"><span class="s-icon">${a}</span><div><b>${b}</b><small>${c}</small></div><strong>${a==='01'?'✓':'○'}</strong></div>`).join('')}</div></div>`}

function renderJob(job){return `<div class="pill">Sample success · ${esc(job.time)}</div><h3 style="margin-top:13px">${esc(job.name)}</h3><pre class="results">${esc(JSON.stringify(job.output,null,2))}</pre><p class="hint">This was a deterministic local preview. No website was scraped and no chargeable Apify event occurred.</p>`}
function runActor(id){const a=AUTO_ACTORS.find(x=>x.id===id);if(!a)return;const requested=Math.max(1,Math.min(10000,Math.trunc(Number($('demoItems')?.value)||100)));const label=String($('demoLabel')?.value||'M1.1 demo dataset').slice(0,50);let output=id==='catalog-watch'?{source:'sample.catalog.test',checkedSKUs:requested,changed:Math.min(requested,Math.ceil(requested*.08)),items:[{sku:'SKU-001',oldPrice:1290,newPrice:1190,change:'price_down'},{sku:'SKU-002',oldStock:17,newStock:0,change:'out_of_stock'}]}:id==='job-pulse'?{feed:'approved-demo-feed',checkedJobs:requested,newJobs:Math.ceil(requested*.06),items:[{title:'Backend Engineer',region:'Bangkok'},{title:'IoT Developer',region:'Remote'}]}:id==='tender-radar'?{feed:'sample-public-tenders',checkedTenders:requested,newTenders:Math.ceil(requested*.02),items:[{ref:'TND-DEMO-001',category:'IT Services',deadline:'Sample only'}]}:{rowsProcessed:requested,duplicatesRemoved:Math.ceil(requested*.02),missingFields:Math.ceil(requested*.01),outputRows:requested-Math.ceil(requested*.02)};output.datasetLabel=label;output.disclaimer='SIMULATED DATA — not scraped, not billable';const job={id:`JOB-${String(Date.now()).slice(-8)}`,name:a.name,time:new Date().toLocaleTimeString(),output,simulated:true};state.runs.unshift(job);state.runs=state.runs.slice(0,30);save();render();toast('Sample job completed — no external API was called');document.getElementById('runOutput')?.scrollIntoView({block:'nearest',behavior:'smooth'})}

function csvTool(){const sample='id,name,email\n1,Alice,alice@example.com\n2,Bob,bob@example.com\n3,,charlie@example.com\n2,Bob,bob@example.com';return pageHead(T('toolsTitle'),T('toolsSub'))+`<div class="tool-layout"><div class="panel"><div class="pill">LOCAL • NO UPLOAD</div><h3 style="font-size:18px;margin:12px 0">${T('csvTitle')}</h3><p class="sub">${T('csvText')}</p><label class="field-label" for="csvFile">Choose a CSV file (processed locally)</label><input class="input m11-file" type="file" accept=".csv,text/csv,text/plain" id="csvFile"/><label class="field-label" for="csvInput">CSV input</label><textarea class="textarea" id="csvInput" rows="13">${sample}</textarea><p class="hint">CSV parser supports quoted delimiters and escaped quotes; this is an MVP utility, not a full spreadsheet parser.</p><button class="primary-btn" id="csvCheck" style="margin-top:8px">✓ ${T('checkCsv')}</button></div><div class="panel"><h3>Validation report</h3><p class="sub">Output is produced entirely by the local browser runtime.</p><pre class="results" id="csvResult">Paste or edit CSV and select Validate CSV.</pre><div class="m11-button-row"><button class="outline-btn" id="copyCsv">⧉ ${T('copy')}</button><button class="outline-btn" id="downloadCsvReport">⇩ Export report (JSON)</button></div></div></div>`}

function parseCSV(text){let rows=[],row=[],cell='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=c}if(quote)throw Error('Unclosed quoted value');row.push(cell);if(row.some(x=>x!==''))rows.push(row);return rows}
function checkCSV(){try{let text=$('csvInput').value.trim();if(!text)throw Error('CSV input is empty');let rows=parseCSV(text),header=rows.shift();if(!rows.length)throw Error('Include at least one data row');const seen=new Set(),dup=[],missing=[],badLength=[];rows.forEach((r,i)=>{const key=JSON.stringify(r);if(seen.has(key))dup.push(i+2);seen.add(key);if(r.length!==header.length)badLength.push(i+2);r.forEach((v,j)=>{if(!v.trim())missing.push({row:i+2,column:header[j]||`Column ${j+1}`})})});const report={columns:header.length,dataRows:rows.length,duplicateRows:dup.length,duplicateRowNumbers:dup.slice(0,30),missingCells:missing.length,missingExamples:missing.slice(0,15),columnCountErrors:badLength.slice(0,15),status:dup.length||missing.length||badLength.length?'REVIEW':'PASS'};$('csvResult').textContent=JSON.stringify(report,null,2);toast('CSV validation complete')}catch(e){$('csvResult').textContent='Validation error: '+e.message}}
function emptyState(title,desc){return `<div class="empty-state"><div class="symbol">▣</div><h3>${esc(title)}</h3><p>${esc(desc)}</p><button class="primary-btn" data-view="marketplace">${T('browse')}</button></div>`}

on><button data-edit="${esc(p.id)}">Edit</button>${p.tag==='CUSTOM'?`<button data-delete="${esc(p.id)}">Delete</button>`:''}</div></td></tr>`).join('')}</tbody></table></div><div class="m11-admin-footer"><button class="outline-btn" id="exportCatalog">⇩ Export catalog JSON</button><button class="outline-btn" id="resetCatalog">↶ Reset sample catalog</button></div>`}

function guides(){const docList=[['PRD','Business PRD','Requirements, customer roles, product scope and acceptance criteria.'],['ARCHITECTURE','System Architecture','Next.js, NestJS, Supabase, Stripe, R2 and Apify boundaries.'],['UI_UX_SPEC','Design System · LOCKED','M0 sidebar, top bar, hero, cards, colors and responsive rules must stay unchanged.'],['WORKFLOWS','Apify A → B','Marketplace, owned platform, hybrid workflow and migration.'],['DATABASE_SCHEMA','Database Schema','Products, orders, entitlements, automation jobs and audit records.'],['IMPLEMENTATION_PLAN','Implementation Roadmap','Milestones, testing gates, release and integration sequencing.']];return pageHead(T('guidesTitle'),T('guidesSub'))+demoBanner()+`<div class="docs-grid">${docList.map(([id,name,summary])=>`<div class="docs-card"><div class="symbol">▤</div><h3>${name}</h3><p>${summary}</p><button class="m11-text-link" data-guide="${id}">Read overview ↗</button></div>`).join('')}</div><div class="section-head"><h2>Release phases</h2></div><div class="panel">${[['M0','Original design & demo','Locked as visual baseline'],['M1.1','Design lock + functional demo upgrades','This build — demo only'],['M2','Supabase Auth, Product CMS and RLS','Not connected'],['M3','Stripe verified checkout + entitlements','Not connected'],['M4','R2 downloads, licenses and Apify API','Not connected']].map(([a,b,c])=>`<div class="path-step"><span class="path-num">${a}</span><div><b>${b}</b><p>${c}</p></div></div>`).join('')}</div>`}

function render(){document.body.classList.toggle('dark',state.dark);document.documentElement.lang=state.lang;document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=T(el.dataset.i18n)});document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.view===state.view));$('langToggle').innerHTML=state.lang.toUpperCase()+' <span>⌄</span>';$('themeToggle').textContent=state.dark?'☀':'☾';$('globalSearch').placeholder=T('search');$('breadcrumb').textContent=T(state.view==='free-tools'?'freeTools':state.view);const content={overview,marketplace,automations,'free-tools':csvTool,library,orders,admin,guides}[state.view];$('content').innerHTML=content();bindContent()}
function bindContent(){document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();setView(el.dataset.view)}));document.querySelectorAll('[data-product]').forEach(el=>{el.addEventListener('click',()=>openProduct(el.dataset.product));el.addEventListener('keydown',e=>{if(e.key==='Enter')openProduct(el.dataset.product)})});document.querySelectorAll('[data-detail]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();openProduct(el.dataset.detail)}));document.querySelectorAll('[data-cat]').forEach(el=>el.addEventListener('click',()=>{state.category=el.dataset.cat;render()}));$('catalogSearch')?.addEventListener('input',e=>{const pos=e.target.selectionStart;state.query=e.target.value;render();$('catalogSearch')?.focus();$('catalogSearch')?.setSelectionRange(pos,pos)});$('currencyToggle')?.addEventListener('click',()=>{state.currency=state.currency==='THB'?'USD':'THB';save();render()});document.querySelectorAll('[data-run]').forEach(el=>el.addEventListener('click',()=>runActor(el.dataset.run)));$('csvCheck')?.addEventListener('click',checkCSV);$('copyCsv')?.addEventListener('click',()=>{const text=$('csvResult').textContent;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard')).catch(()=>toast('Copy unavailable; select the result text'));else toast('Select the text to copy')});$('csvFile')?.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>2*1024*1024){toast('Please choose a CSV smaller than 2 MB');e.target.value='';return}const data=await file.text();$('csvInput').value=data;toast('CSV loaded locally; no upload occurred')});$('downloadCsvReport')?.addEventListener('click',()=>{try{const report=JSON.parse($('csvResult').textContent);downloadJSON('buildnest-csv-validation.json',report)}catch(_){toast('Validate the CSV first')}});$('exportJob')?.addEventListener('click',()=>{if(state.runs.length)downloadJSON('buildnest-sample-job.json',state.runs[0])});$('exportCatalog')?.addEventListener('click',()=>downloadJSON('buildnest-demo-catalog.json',{demo:true,products:state.products}));$('resetCatalog')?.addEventListener('click',()=>{if(confirm('Restore demo catalog and remove local edits?')){state.products=JSON.parse(JSON.stringify(BASE_PRODUCTS));save();render();toast('Sample catalog restored')}});document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>editProductModal(el.dataset.edit)));document.querySelectorAll('[data-guide]').forEach(el=>el.addEventListener('click',()=>openGuide(el.dataset.guide)));document.querySelectorAll('[data-guide-product]').forEach(el=>el.addEventListener('click',()=>openProductGuide(el.dataset.guideProduct)));$('addProductBtn')?.addEventListener('click',addProductModal);document.querySelectorAll('[data-delete]').forEach(el=>el.addEventListener('click',()=>{state.products=state.products.filter(p=>p.id!==el.dataset.delete);save();render();toast('Demo product deleted')}))}
function openProduct(id){const p=state.products.find(x=>x.id===id);if(!p)return;let free=p.price===0;let content=`<div class="modal-head"><div><div class="eyebrow">${esc(p.category)} · ${esc(p.sub)}</div><h2>${esc(p.name)}</h2><p>${esc(state.lang==='th'?(p.th||p.desc):p.desc)}</p></div><button class="modal-close" data-close="1">×</button></div><div class="product-cover ${esc(p.cover)}"><div class="cover-icon">${esc(p.icon)}</div></div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:17px"><div><span class="pill purple">${esc(p.tag)}</span> <span class="muted" style="font-size:10px">${esc(p.kind)}</span></div><strong style="font-size:22px">${fmt(p)}</strong></div><h3 style="font-size:13px;margin:20px 0 10px">Features & scope</h3><ul class="features">${(p.features||[]).map(f=>`<li>${esc(f)}</li>`).join('')}</ul>${p.id==='slipguard'?'<span style="display:inline-flex;font-weight:750;color:#5162df;font-size:12px;margin:6px 0 9px">Separate SlipGuard simulation is included in the project ZIP</span>':''}<p class="hint">Product concepts are illustrative. Only the CSV Validator is working locally; SlipGuard has a separate simulated demo. External API features have not been implemented.</p><div class="modal-actions"><button class="primary-btn" id="modalBuy">${free?T('trial'):T('buy')} ↗</button><button class="outline-btn" id="modalCancel">${T('cancel')}</button></div>`;modal(content);$('modalBuy').addEventListener('click',()=>{closeModal();if(free)setView('free-tools');else checkoutModal(p)});$('modalCancel').addEventListener('click',closeModal)}
function modal(html){$('modalLayer').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;$('backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()});document.querySelectorAll('[data-close]').forEach(x=>x.addEventListener('click',closeModal))}function closeModal(){$('modalLayer').innerHTML=''}
function checkoutModal(p){modal(`<div class="modal-head"><div><div class="eyebrow">PAYMENT FLOW / SIMULATION</div><h2>${T('checkout')}</h2><p>${T('checkoutInfo')}</p></div><button class="modal-close" data-close="1">×</button></div><div class="demo-banner">⚠ ${T('notReal')}</div><div class="checkout-panel"><div class="checkout-line"><span>${esc(p.name)}</span><b>฿${p.price.toLocaleString()}</b></div><div class="checkout-line"><span>License</span><span>Personal · demonstration</span></div><div class="checkout-line total"><span>Total (simulated)</span><span>฿${p.price.toLocaleString()}</span></div></div><p class="hint">No payment fields are collected. Purchase confirmation creates only a browser-local demo order.</p><button class="primary-btn" id="confirmCheckout" style="width:100%;margin-top:17px">${T('confirmDemo')} ↗</button>`);$('confirmCheckout').addEventListener('click',()=>{state.orders.unshift({id:'DEMO-'+String(Date.now()).slice(-8),productId:p.id,name:p.name,price:p.price,date:new Date().toLocaleString()});save();closeModal();setView('library');toast('Demo order added to your local library; no payment occurred')})}
function addProductModal(){modal(`<div class="modal-head"><div><div class="eyebrow">LOCAL PRODUCT CMS</div><h2>${T('addProduct')}</h2><p>Changes are browser-local and not synchronized to Supabase.</p></div><button class="modal-close" data-close="1">×</button></div><form id="productForm"><label class="field-label">${T('productName')}</label><input required maxlength="80" name="name" class="input" placeholder="e.g. Desktop Backup Agent"/><label class="field-label">${T('category')}</label><select name="category" class="category-select"><option>Automation</option><option>AI & OCR</option><option>Industrial</option><option>Developer</option><option>Desktop</option><option>Free Tool</option></select><label class="field-label">${T('productPrice')}</label><input required min="0" max="100000" type="number" name="price" class="input" value="990"/><label class="field-label">${T('description')}</label><textarea required maxlength="240" rows="3" name="desc" class="textarea"></textarea><div class="modal-actions"><button class="primary-btn" type="submit">${T('add')}</button><button class="outline-btn" type="button" id="cancelAdd">${T('cancel')}</button></div></form>`);$('cancelAdd').addEventListener('click',closeModal);$('productForm').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target),name=String(fd.get('name')||'').trim(),price=Number(fd.get('price')),desc=String(fd.get('desc')||'').trim(),category=String(fd.get('category'));if(!name||!desc||!Number.isFinite(price)||price<0)return;const id='demo-'+Date.now();state.products.unshift({id,name,price,usd:Math.round(price/29),desc,th:desc,category,sub:'New / Local demo',icon:'✦',cover:'cover-a',tag:'CUSTOM',features:['Added in local browser catalog'],kind:'demo'});save();closeModal();render();toast('Demo product created locally')})}

/* M1.1 features use the original M0 modal/card visual language; they never mutate layout or tokens. */
const M11_GUIDES={
 PRD:['Product Requirements','A bilingual digital software store for Desktop, AI/OCR, Automation and Industrial tools. Customer flows: discover → preview → purchase → library; admin flows: catalog → release → analytics. All real purchases remain disabled in this demo.'],
 ARCHITECTURE:['Architecture','Next.js storefront + NestJS API + PostgreSQL/Supabase Auth and RLS + Stripe verified webhooks + private Cloudflare R2 + optional Apify orchestration. All credentials stay server-side.'],
 UI_UX_SPEC:['Locked Design System','Original M0 is the single approved baseline. Preserve #0b1325 sidebar, purple selected navigation, white top bar, pale page background, gradient hero, product cards and mobile drawer. Every UI change requires comparison screenshots.'],
 WORKFLOWS:['Marketplace → Owned Platform','A: Users discover Apify Actors and pay through Apify. B: Users buy credits on owned site through Stripe; backend invokes approved compute services. Hybrid: both channels run simultaneously; transition based on tested cost and retention.'],
 DATABASE_SCHEMA:['Data Model','products, categories, product_releases, customers/profiles, orders, order_items, entitlements, license_keys, automation_jobs, usage_events, webhook_events. Apply tenant/owner isolation and idempotent payment handling.'],
 IMPLEMENTATION_PLAN:['Delivery Milestones','M0 visual demo → M1.1 design-lock baseline → M2 Auth/CMS → M3 Stripe and entitlements → M4 R2 and automation jobs. Production access is blocked until full dependency build, security tests, and credentials.']
};
function downloadJSON(filename,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function openGuide(id){const g=M11_GUIDES[id];if(!g)return;modal(`<div class="modal-head"><div><div class="eyebrow">BUILDNEST / DOCUMENTATION</div><h2>${esc(g[0])}</h2></div><button class="modal-close" data-close="1">×</button></div><p class="m11-guide-text">${esc(g[1])}</p><div class="demo-banner">Full technical documents are included in the downloadable source archive under /docs.</div><button class="outline-btn" id="guideClose">Close</button>`);$('guideClose').addEventListener('click',closeModal)}
function openProductGuide(id){const p=state.products.find(p=>p.id===id);if(!p)return;const bullets=(p.features||[]).map(x=>`<li>${esc(x)}</li>`).join('');modal(`<div class="modal-head"><div><div class="eyebrow">SOFTWARE LIBRARY / DOCUMENTATION</div><h2>${esc(p.name)}</h2><p>Demo user guide · no real artifact is distributed</p></div><button class="modal-close" data-close="1">×</button></div><h3>Product overview</h3><p>${esc(p.desc)}</p><h3>Planned capabilities</h3><ul class="features">${bullets}</ul><h3>Installation & delivery</h3><p class="m11-guide-text">After a real purchase, users will obtain the approved release archive from private storage via expiring signed download links, along with SHA-256 checksum, platform requirements, installation steps and license terms. This prototype intentionally contains no executable installer or license key.</p><button class="outline-btn" id="guideClose">Close</button>`);$('guideClose').addEventListener('click',closeModal)}
function editProductModal(id){const p=state.products.find(p=>p.id===id);if(!p)return;modal(`<div class="modal-head"><div><div class="eyebrow">LOCAL PRODUCT CMS</div><h2>Edit product</h2><p>Changes are stored only in this browser.</p></div><button class="modal-close" data-close="1">×</button></div><form id="editProductForm"><label class="field-label">Name</label><input name="name" class="input" required maxlength="80" value="${esc(p.name)}"/><label class="field-label">Price (THB)</label><input name="price" class="input" required min="0" max="100000" type="number" value="${Number(p.price)}"/><label class="field-label">Description</label><textarea name="desc" class="textarea" maxlength="240" required rows="3">${esc(p.desc)}</textarea><div class="modal-actions"><button class="primary-btn" type="submit">Save demo changes</button><button class="outline-btn" type="button" id="cancelEdit">Cancel</button></div></form>`);$('cancelEdit').addEventListener('click',closeModal);$('editProductForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')||'').trim(),price=Number(f.get('price')),desc=String(f.get('desc')||'').trim();if(!name||!desc||!Number.isFinite(price)||price<0||price>100000)return;p.name=name;p.desc=desc;p.th=desc;p.price=price;p.usd=Math.max(1,Math.round(price/28));save();closeModal();render();toast('Product updated in your browser')})}

$('primaryNav').addEventListener('click',e=>{const btn=e.target.closest('[data-view]');if(btn)setView(btn.dataset.view)});document.querySelectorAll('.sidebar nav:nth-of-type(n+2) .nav-item').forEach(el=>el.addEventListener('click',()=>setView(el.dataset.view)));
$('mobileMenu').addEventListener('click',()=>{$('sidebar').classList.add('open');$('overlay').classList.add('open')});$('sideClose').addEventListener('click',()=>{$('sidebar').classList.remove('open');$('overlay').classList.remove('open')});$('overlay').addEventListener('click',()=>{$('sidebar').classList.remove('open');$('overlay').classList.remove('open')});$('themeToggle').addEventListener('click',()=>{state.dark=!state.dark;save();render()});$('langToggle').addEventListener('click',()=>{state.lang=state.lang==='en'?'th':'en';save();render()});$('notificationBtn').addEventListener('click',()=>toast('Demo milestone M0: no live backend, payments or deployment.'));
$('globalSearch').addEventListener('input',e=>{if(state.view!=='marketplace')state.view='marketplace';state.query=e.target.value;render();$('globalSearch').value=state.query});$('planView').addEventListener('click',()=>setView('guides'));document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('globalSearch').focus()}if(e.key==='Escape')closeModal()});
const queryParams=new URLSearchParams(location.search);if(queryParams.get('lang')==='th'||queryParams.get('lang')==='en')state.lang=queryParams.get('lang');
const landingView=queryParams.get('view');
if(['overview','marketplace','automations','free-tools','guides','library','orders','admin'].includes(landingView))state.view=landingView;
render();
const landingProduct=queryParams.get('product');
if(landingProduct&&state.products.some(p=>p.id===landingProduct))setTimeout(()=>openProduct(landingProduct),0);

// Offline previews cannot access Next.js API-backed M2 routes.
window.addEventListener('click',function(e){const a=e.target.closest('a[href$="/manage/products"],a[href$="/account"],a[href$="/live-catalog"]');if(a){e.preventDefault();toast('M2 account/CMS/database routes require the Next.js app and authorized Supabase setup.')}});
</script>
</body></html>
